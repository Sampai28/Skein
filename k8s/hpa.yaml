apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skein
  labels:
    app.kubernetes.io/name: skein
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skein
  minReplicas: 2
  maxReplicas: 10

  metrics:
    # CPU is a weak signal for an I/O-bound async service — a pod saturated on
    # concurrent LLM calls can sit at 15% CPU. It is here as a floor for the
    # case where tools are CPU-bound and the loop is genuinely busy.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    # The metric that actually reflects load. Queue depth rising means arrivals
    # are outpacing completions, which is precisely when another replica helps.
    # Requires a Prometheus adapter to expose skein_queue_depth as a custom
    # metric; without one, this entry is ignored and CPU alone drives scaling.
    - type: Pods
      pods:
        metric:
          name: skein_queue_depth
        target:
          type: AverageValue
          averageValue: "16"

  behavior:
    scaleUp:
      # React quickly: a full queue is already rejecting submissions.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Slowly. Each removed pod drains for up to 35 seconds, and scaling down
      # into a traffic dip only to scale back up costs more availability than
      # the idle replica costs money.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
