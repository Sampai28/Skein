apiVersion: apps/v1
kind: Deployment
metadata:
  name: skein
  labels:
    app.kubernetes.io/name: skein
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: skein
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never take capacity below the desired count during a roll. With
      # maxUnavailable > 0 and a 25s drain, a rolling update briefly runs at
      # reduced capacity while the remaining pods are also draining.
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skein
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # ── Shutdown timing ────────────────────────────────────────────────
      # The sequence on pod deletion is: endpoints are removed AND preStop runs
      # concurrently, then SIGTERM, then SIGKILL at the end of the grace period.
      #
      #   preStop sleep            5s   endpoint removal propagates
      #   SKEIN_DRAIN_TIMEOUT_S   25s   in-flight runs finish
      #   SKEIN_CANCEL_TIMEOUT_S   5s   remainder cancelled, cleanup runs
      #                           ---
      #                            35s  < terminationGracePeriodSeconds (40)
      #
      # If the grace period were shorter than that sum, SIGKILL would land
      # partway through cancellation and skip the cleanup the runtime is built
      # around.
      terminationGracePeriodSeconds: 40

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: skein
          image: skein:local
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: skein-config

          resources:
            requests:
              # Single-threaded event loop: more than ~1 CPU buys nothing for
              # the loop itself, and the request is what the HPA scales against.
              cpu: "500m"
              memory: "256Mi"
            limits:
              # No CPU limit set on purpose. A CFS quota throttles the event
              # loop in bursts, which shows up as latency spikes that look like
              # application stalls. The memory limit is the real guard.
              memory: "512Mi"

          # Liveness: is the process functioning. Deliberately does not check
          # Ollama — restarting a healthy pod because a dependency is down turns
          # someone else's outage into a restart loop.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness: should this pod receive traffic. Reports false while
          # draining and while the ingress queue is full, so the load balancer
          # stops routing here before the drain begins.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            # 1, not 3. A draining pod should leave the endpoint list on the
            # first failed check, not fifteen seconds later.
            failureThreshold: 1

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30

          lifecycle:
            preStop:
              exec:
                # Endpoint removal is eventually consistent across kube-proxy on
                # every node. Without this pause, requests continue arriving for
                # a second or two after SIGTERM — at which point the app is
                # already refusing them. Sleeping first lets routing settle
                # before the drain starts.
                command: ["/bin/sh", "-c", "sleep 5"]

          volumeMounts:
            - name: traces
              mountPath: /app/traces

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

      volumes:
        # emptyDir, not a PVC. Traces are per-pod run artefacts; a shared volume
        # would need ReadWriteMany and would not make the store durable anyway,
        # since the run state itself is in memory.
        - name: traces
          emptyDir:
            sizeLimit: 1Gi
