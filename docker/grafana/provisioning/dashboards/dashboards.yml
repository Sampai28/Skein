apiVersion: 1

providers:
  - name: skein
    orgId: 1
    folder: Skein
    type: file
    disableDeletion: false
    # Provisioned dashboards are read-only in the UI by default; allowing
    # updates means edits made while debugging survive until the next restart,
    # which is the behaviour people expect from a local stack.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
